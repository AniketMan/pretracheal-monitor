name: PneumaSense
options:
  bundleIdPrefix: com.pneumasense
  deploymentTarget:
    iOS: "26.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: false

targets:
  PneumaSense:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
      - path: AppIcon.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pneumasense.monitor
        PRODUCT_NAME: PneumaSense
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5BF427L96N

  PneumaSenseTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests
    dependencies:
      - target: PneumaSense
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pneumasense.monitor.tests
        GENERATE_INFOPLIST_FILE: true
        DEVELOPMENT_TEAM: 5BF427L96N

schemes:
  PneumaSense:
    build:
      targets:
        PneumaSense: all
        PneumaSenseTests: [test]
    test:
      config: Debug
      targets:
        - PneumaSenseTests
    run:
      config: Debug
    archive:
      config: Release
